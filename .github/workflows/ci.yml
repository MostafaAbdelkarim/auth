name: CI

# Runs on every pull request (any target branch) and on every push to main.
# Trunk-based flow: main is the only long-lived branch; see cd.yml and release.yml for delivery.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit, lint, typecheck, test (coverage ≥95%), build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache MongoDB binary (used by the API e2e tests)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - name: Makefile targets resolve
        run: make -n verify demo dev > /dev/null
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only)
        run: npm audit || true
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with enforced coverage thresholds
        run: npm test
      - run: npm run build

  docker:
    name: Docker images (build + vulnerability scan)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build images
        run: docker compose -p easygenerator build --pull
        env:
          JWT_ACCESS_SECRET: ci-only-placeholder-not-used-at-runtime
          MONGO_ROOT_PASSWORD: ci-only-placeholder
          MONGO_APP_PASSWORD: ci-only-placeholder
          SWAGGER_PASSWORD: ci-only-placeholder

      - name: Cache Trivy vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Fails the build on HIGH/CRITICAL vulnerabilities that have a fix available (OS packages
      # and bundled libraries in the images, which `npm audit` can't see). Trivy runs from its
      # official, version-pinned image rather than a third-party action.
      - name: Scan images with Trivy
        run: |
          for app in api web; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 --no-progress "easygenerator-$app:latest"
          done
